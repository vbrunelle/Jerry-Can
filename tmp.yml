# Example Docker Compose file that uses the pre-built images published on
# GitHub Container Registry (ghcr.io) instead of building locally.
#
# Usage:
#   docker compose -f docker-compose.ghcr.yml pull
#   docker compose -f docker-compose.ghcr.yml up -d

services:
  jerry-can:
    image: ghcr.io/vbrunelle/jerry-can:main
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_PATH: /data/fuel_prices.db
      # Hudi is the default backend. Uncomment below to fall back to SQLite:
      # PERSISTENCE_BACKEND: sqlite
    volumes:
      - /srv/dev-disk-by-uuid-8ded71ac-34ba-418b-8ade-afdf34bfbd1d/jerrycan/data:/data
    restart: unless-stopped
    networks:
      - internal

  django:
    image: ghcr.io/vbrunelle/jerry-can-management:latest
    env_file:
      - path: .env
        required: false
    environment:
      DJANGO_SETTINGS_MODULE: jerrycan_web.settings
      DJANGO_DB_PATH: /data/django_db.sqlite3
      DATABASE_PATH: /data/fuel_prices.db
      HUDI_TABLE_PATH: /data/hudi/fuel_prices
      PERSISTENCE_BACKEND: ${PERSISTENCE_BACKEND:-sqlite}
    volumes:
      - type: bind
        source: ${DATA_DIR:-./data}
        target: /data
      - django-static:/app/staticfiles
    restart: unless-stopped
    depends_on:
      - jerry-can
    networks:
      - internal

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - django-static:/app/staticfiles:ro
    restart: unless-stopped
    depends_on:
      - django
    networks:
      - internal

volumes:
  django-static:

networks:
  internal:
    driver: bridge