<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>Sign in — Jerry Can</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@latest/dist/css/tabler.min.css"/>
</head>
<body class="antialiased">
<div class="page page-center">
  <div class="container container-tight py-4">
    <div class="text-center mb-4">
      <h2>⛽ Jerry Can</h2>
    </div>
    <div class="card card-md">
      <div class="card-body">
        <h2 class="h2 text-center mb-4">Sign in to your account</h2>
        <form method="post" novalidate>
          {% csrf_token %}
          {% if form.errors %}
          <div class="alert alert-danger" role="alert">
            Invalid username or password.
          </div>
          {% endif %}
          <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" name="username" class="form-control" placeholder="Username" autofocus autocomplete="username"/>
          </div>
          <div class="mb-2">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" placeholder="Password" autocomplete="current-password"/>
          </div>
          <div class="form-footer">
            <button type="submit" class="btn btn-primary w-100">Sign in</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@tabler/core@latest/dist/js/tabler.min.js"></script>
</body>
</html>
