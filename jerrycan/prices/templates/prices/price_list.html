{% extends "prices/base.html" %}
{% block title %}Prices{% endblock %}
{% block nav_prices %}active{% endblock %}
{% block page_title %}Prices{% endblock %}

{% block content %}
<div class="card">
  <div class="card-body">
    <div id="pivot-output"></div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pivottable/2.23.0/pivot.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jqueryui/1.13.2/jquery-ui.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pivottable/2.23.0/pivot.min.js"></script>
<script>
  $(function() {
    var data = {{ prices_json|safe }};
    $("#pivot-output").pivotUI(data, {
      rows: ["Region", "City", "Station"],
      cols: ["Fuel"],
      aggregatorName: "Average",
      vals: ["Price"],
    });
  });
</script>
{% endblock %}
