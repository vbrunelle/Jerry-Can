<style>
  /* ════════════════════════════════════════════════════════════
     Pivottable.js — thème Jerry-Can / Tabler
     pivot.min.css n'est PAS chargé ; toutes les règles sont ici.
     ════════════════════════════════════════════════════════════ */

  /* ── Structural rules absorbed from pivot.css ── */
  .pvtUi td { padding: 3px; }
  .pvtAxisContainer ul, .pvtVals ul { margin: 0; padding: 0; list-style: none; }
  .pvtAxisContainer li, .pvtVals li { list-style: none; cursor: move; padding: 1px 3px; }
  .pvtHorizList li { display: inline; }
  .pvtVertList  li { display: block; }
  .pvtFilteredAttribute { font-style: italic; opacity: 0.7; }
  .pvtAggregator { margin-bottom: 3px; }
  .pvtAxisLabel { width: 10px; text-align: center; }
  .pvtVals { text-align: center; }
  /* Keep the rows-axis cell top-aligned and as narrow as its content */
  .pvtRows { vertical-align: top !important; width: 1%; }
  .pvtCheckContainer { text-align: left; overflow-y: auto; height: 200px; }
  .pvtCheckContainer p { margin: 2px; }

  /* ── Main container ── */
  .pvtUi {
    font-family: var(--tblr-font-sans-serif, inherit);
    font-size: 0.875rem;
    color: var(--tblr-body-color, #1d273b);
    border-collapse: separate;
    border-spacing: 4px;
  }

  /* ── Renderer & aggregator selects ── */
  .pvtUi select {
    appearance: none;
    display: inline-block;
    width: auto;
    padding: 0.3rem 2rem 0.3rem 0.6rem;
    font-size: 0.875rem;
    font-family: inherit;
    color: var(--tblr-body-color, #1d273b);
    background: #fff url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3e%3cpath fill='none' stroke='%23626976' stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='m2 5 6 6 6-6'/%3e%3c/svg%3e") no-repeat right 0.5rem center/14px 10px;
    border: 1px solid var(--tblr-border-color, #e6e7e9);
    border-radius: var(--tblr-border-radius, 4px);
    cursor: pointer;
  }
  /* Aggregator select has long options ("Sample Standard Deviation", etc.) — cap its width.
     The native dropdown when open still renders options at full width in all browsers. */
  select.pvtAggregator {
    max-width: 130px;
    text-overflow: ellipsis;
    overflow: hidden;
  }
  .pvtUi select:focus {
    outline: none;
    border-color: var(--tblr-primary, #206bc4);
    box-shadow: 0 0 0 0.2rem rgba(32,107,196,.15);
  }

  /* ── Sort order buttons (↕ ⇄) ── */
  .pvtRowOrder, .pvtColOrder {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 1rem;
    line-height: 1;
    width: 22px;
    height: 22px;
    padding: 0;
    border: 1px solid var(--tblr-border-color, #e6e7e9);
    border-radius: var(--tblr-border-radius, 4px);
    color: var(--tblr-secondary, #626976);
    background: #fff;
    user-select: none;
    vertical-align: middle;
  }
  .pvtRowOrder:hover, .pvtColOrder:hover {
    color: var(--tblr-primary, #206bc4);
    border-color: var(--tblr-primary, #206bc4);
  }

  /* ── Drag-and-drop zones ── */
  .pvtAxisContainer, .pvtVals {
    background: var(--tblr-bg-surface, #fff);
    border: 1px solid var(--tblr-border-color, #e6e7e9);
    border-radius: var(--tblr-border-radius, 4px);
    padding: 4px 6px;
    min-width: 20px;
    min-height: 30px;
    vertical-align: top;
    white-space: nowrap;
  }

  /* ── Unused fields zone ── */
  .pvtUnused { background: var(--tblr-bg-surface-secondary, #f6f8fb); }

  /* ── Attribute chips ── */
  .pvtAttr {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: var(--tblr-primary-lt, #e8f0fe);
    color: var(--tblr-primary, #206bc4);
    border: 1px solid var(--tblr-primary, #206bc4);
    border-radius: calc(var(--tblr-border-radius, 4px) - 1px);
    padding: 2px 8px;
    font-size: 0.8125rem;
    user-select: none;
    cursor: grab;
    white-space: nowrap;
  }
  .pvtAttr:hover { background: var(--tblr-primary, #206bc4); color: #fff; }

  /* ── Filter triangle inside chip ── */
  .pvtTriangle {
    font-size: 0.65rem;
    color: var(--tblr-primary, #206bc4);
    cursor: pointer;
    opacity: 0.7;
  }
  .pvtAttr:hover .pvtTriangle { color: #fff; opacity: 1; }

  /* ── Filter popup ── */
  .pvtFilterBox {
    z-index: 100;
    width: 300px;
    position: absolute;
    background: var(--tblr-bg-surface, #fff);
    border: 1px solid var(--tblr-border-color, #e6e7e9);
    border-radius: var(--tblr-border-radius, 4px);
    box-shadow: 0 4px 16px rgba(0,0,0,.12);
    padding: 12px;
    font-size: 0.875rem;
    color: var(--tblr-body-color, #1d273b);
  }
  .pvtFilterBox h4 { margin: 0 0 8px; font-size: 0.875rem; font-weight: 600; }
  .pvtFilterBox p { margin: 8px 0; }
  .pvtFilterBox p label { float: right; cursor: pointer; font-size: 0.8125rem; }
  .pvtFilterBox input[type=text] {
    width: 100%;
    padding: 0.3rem 0.6rem;
    font-size: 0.875rem;
    font-family: inherit;
    color: var(--tblr-body-color, #1d273b);
    background: var(--tblr-bg-surface, #fff);
    border: 1px solid var(--tblr-border-color, #e6e7e9);
    border-radius: var(--tblr-border-radius, 4px);
    margin-bottom: 6px;
    box-sizing: border-box;
  }
  .pvtFilterBox input[type=text]:focus {
    outline: none;
    border-color: var(--tblr-primary, #206bc4);
    box-shadow: 0 0 0 0.2rem rgba(32,107,196,.15);
  }
  .pvtButton {
    float: right;
    margin: 3px;
    padding: 0.25rem 0.75rem;
    font-size: 0.8125rem;
    font-weight: 500;
    font-family: inherit;
    color: var(--tblr-primary, #206bc4);
    background: var(--tblr-bg-surface, #fff);
    border: 1px solid var(--tblr-primary, #206bc4);
    border-radius: var(--tblr-border-radius, 4px);
    cursor: pointer;
  }
  .pvtButton:hover {
    background: var(--tblr-primary, #206bc4);
    color: #fff;
  }

  /* ── Pivot table ── */
  table.pvtTable {
    border-collapse: collapse;
    width: auto;
    font-family: var(--tblr-font-sans-serif, inherit);
    font-size: 0.875rem;
    color: var(--tblr-body-color, #1d273b);
  }

  /* Span header row (e.g. "FUEL") and column value headers (DIESEL, RÉGULIER…) — stay on one line */
  table.pvtTable thead tr th {
    background: var(--tblr-bg-surface-secondary, #f6f8fb);
    border-bottom: 2px solid var(--tblr-border-color, #e6e7e9);
    border-right: 1px solid var(--tblr-border-color, #e6e7e9);
    padding: 0.4rem 0.75rem;
    font-weight: 600;
    color: var(--tblr-secondary, #626976);
    text-transform: uppercase;
    font-size: 0.6875rem;
    letter-spacing: .05em;
    vertical-align: bottom;
    white-space: nowrap;
    width: 80px;
    text-align: right;
  }

  /* Row header cells (dimension labels) — wrap allowed, capped width */
  table.pvtTable tbody tr th,
  table.pvtTable .pvtRowLabel,
  table.pvtTable .pvtColLabel {
    background: var(--tblr-bg-surface-secondary, #f6f8fb);
    border-bottom: 1px solid var(--tblr-border-color, #e6e7e9);
    border-right: 1px solid var(--tblr-border-color, #e6e7e9);
    padding: 0.4rem 0.75rem;
    color: var(--tblr-secondary, #626976);
    font-size: 0.6875rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .05em;
    white-space: normal;
    overflow-wrap: break-word;
    max-width: 160px;
    text-align: left;
  }

  /* Data cells */
  table.pvtTable tbody tr td {
    background: var(--tblr-bg-surface, #fff);
    border-bottom: 1px solid var(--tblr-border-color, #e6e7e9);
    border-right: 1px solid var(--tblr-border-color, #e6e7e9);
    padding: 0.4rem 0.75rem;
    vertical-align: middle;
    color: var(--tblr-body-color, #1d273b);
  }
  table.pvtTable tbody tr:hover td,
  table.pvtTable tbody tr:hover th {
    background: var(--tblr-table-hover-bg, #edf2fb);
  }

  /* Value cells — fixed compact width, right-aligned */
  table.pvtTable .pvtVal {
    text-align: right;
    font-variant-numeric: tabular-nums;
    width: 80px;
    white-space: nowrap;
  }

  /* Subtotal & grand total — same width */
  table.pvtTable .pvtTotal,
  table.pvtTable .pvtGrandTotal {
    text-align: right;
    font-variant-numeric: tabular-nums;
    font-weight: 600;
    width: 80px;
    white-space: nowrap;
    background: var(--tblr-bg-surface-secondary, #f6f8fb);
    color: var(--tblr-body-color, #1d273b);
    border-top: 2px solid var(--tblr-border-color, #e6e7e9);
  }

  /* "Totals" row label */
  table.pvtTable .pvtTotalLabel {
    font-weight: 600;
    font-size: 0.6875rem;
    text-transform: uppercase;
    letter-spacing: .05em;
    text-align: right;
    color: var(--tblr-secondary, #626976);
    background: var(--tblr-bg-surface-secondary, #f6f8fb);
    border-top: 2px solid var(--tblr-border-color, #e6e7e9);
  }
</style>
