# Example Docker Compose file that uses the pre-built images published on
# GitHub Container Registry (ghcr.io) instead of building locally.
#
# Usage:
#   docker compose -f docker-compose.ghcr.yml pull
#   docker compose -f docker-compose.ghcr.yml up -d

services:
  jerry-can:
    image: ghcr.io/vbrunelle/jerry-can:main
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_PATH: /data/fuel_prices.db
      # Hudi is the default backend. Uncomment below to fall back to SQLite:
      # PERSISTENCE_BACKEND: sqlite
    volumes:
      - type: bind
        source: ${DATA_DIR:-./data}
        target: /data
    restart: unless-stopped
    networks:
      - internal

  django:
    image: ghcr.io/vbrunelle/jerry-can-management:main
    env_file:
      - path: .env
        required: false
    environment:
      DJANGO_SETTINGS_MODULE: jerrycan_web.settings
      DJANGO_DB_PATH: /data/django_db.sqlite3
      DATABASE_PATH: /data/fuel_prices.db
      HUDI_TABLE_PATH: /data/hudi/fuel_prices
      PERSISTENCE_BACKEND: ${PERSISTENCE_BACKEND:-sqlite}
    volumes:
      - type: bind
        source: ${DATA_DIR:-./data}
        target: /data
      - django-static:/app/staticfiles
    restart: unless-stopped
    depends_on:
      - jerry-can
    networks:
      - internal

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - django-static:/app/staticfiles:ro
    configs:
      - source: nginx-conf
        target: /etc/nginx/conf.d/default.conf
    restart: unless-stopped
    depends_on:
      - django
    networks:
      - internal

configs:
  nginx-conf:
    content: |
      upstream django {
          server django:8000;
      }

      server {
          listen 80;
          server_name _;

          # Security headers
          add_header X-Frame-Options "SAMEORIGIN" always;
          add_header X-Content-Type-Options "nosniff" always;
          add_header X-XSS-Protection "1; mode=block" always;
          add_header Referrer-Policy "strict-origin-when-cross-origin" always;

          # Max upload size (for any future file uploads)
          client_max_body_size ${NGINX_CLIENT_MAX_BODY_SIZE:-10M};

          # Static files served by nginx
          location /static/ {
              alias /app/staticfiles/;
              expires 30d;
              add_header Cache-Control "public, immutable";
          }

          # Proxy to Django/Gunicorn
          location / {
              proxy_pass http://django;
              proxy_set_header Host $$host;
              proxy_set_header X-Real-IP $$remote_addr;
              proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $$scheme;
              proxy_redirect off;

              # Timeouts for slow CSV generation
              proxy_connect_timeout 60s;
              proxy_read_timeout 300s;
              proxy_send_timeout 300s;
          }
      }

volumes:
  django-static:

networks:
  internal:
    driver: bridge
