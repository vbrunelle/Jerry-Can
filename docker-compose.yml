services:
  web:
    build:
      context: ./jerrycan
      dockerfile: Dockerfile
    image: ghcr.io/vbrunelle/jerry-can:latest
    env_file: .env
    volumes:
      - app_data:/app/data
      - static_files:/app/staticfiles
    depends_on: []
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "${NGINX_PORT:-8080}:80"
    environment:
      - NGINX_CONF=${NGINX_CONF}
    volumes:
      - static_files:/app/staticfiles:ro
    depends_on:
      - web
    restart: unless-stopped
    command:
      - /bin/sh
      - -c
      - printf "%b" "$$NGINX_CONF" > /etc/nginx/conf.d/default.conf && exec nginx -g "daemon off;"

volumes:
  app_data:
  static_files:
