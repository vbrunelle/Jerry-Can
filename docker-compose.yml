services:
  jerry-can:
    image: ghcr.io/vbrunelle/jerry-can:latest
    build: .
    env_file:
      - path: .env
        required: false
    volumes:
      - type: bind
        source: ${DATA_DIR:-./data}
        target: /data
    restart: unless-stopped
    # Hudi is the default backend. Uncomment below to fall back to SQLite:
    # environment:
    #   PERSISTENCE_BACKEND: sqlite
