services:
  web:
    build:
      context: ./jerrycan
      dockerfile: Dockerfile
    image: ghcr.io/vbrunelle/jerry-can:latest
    env_file: .env
    volumes:
      - app_data:/app/data
      - static_files:/app/staticfiles
    depends_on: []
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_files:/app/staticfiles:ro
    depends_on:
      - web
    restart: unless-stopped

volumes:
  app_data:
  static_files:
