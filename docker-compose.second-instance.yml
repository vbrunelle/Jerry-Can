services:
  web:
    build:
      context: ./jerrycan
      dockerfile: Dockerfile
    image: ghcr.io/vbrunelle/jerry-can:latest
    env_file: .env
    environment:
      DJANGO_DEBUG: 'True'
      DJANGO_DB_DIR: /app/dev_data
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost:8081,http://127.0.0.1:8081
    volumes:
      - ./jerrycan/dev_data:/app/dev_data
      - second_static_files:/app/staticfiles
    depends_on: []
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "8081:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - second_static_files:/app/staticfiles:ro
    depends_on:
      - web
    restart: unless-stopped

volumes:
  second_static_files: